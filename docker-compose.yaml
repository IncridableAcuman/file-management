services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: filevault-postgres
    restart: always
    environment:
      POSTGRES_DB: filemanagement
      POSTGRES_USER: admin2003
      POSTGRES_PASSWORD: admin2003
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - filevault-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin2003 -d filemanagement"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & OTP Store
  redis:
    image: redis:7-alpine
    container_name: filevault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - filevault-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: filevault-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - filevault-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: filevault-backend
    restart: always
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/filemanagement
      DB_USER: admin2003
      DB_PASS: admin2003
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A
      JWT_ACCESS_TIME: 900000
      JWT_REFRESH_TIME: 604800000
      COOKIE_SECURE: "false"
      MAIL_USER: abdusharipovizzat03@gmail.com
      MAIL_PASS: vrykfwgjneczwqij
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - filevault-network

  # React Frontend (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: filevault-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - filevault-network

networks:
  filevault-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
