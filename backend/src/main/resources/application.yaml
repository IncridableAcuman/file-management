server:
  port: ${PORT}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: backend
  datasource:
    url: ${DB_USER}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  access_time: ${JWT_ACCESS_TIME}
  refresh_time: ${JWT_REFRESH_TIME}

cookie:
  secure: ${COOKIE_SECURE}
